name: Windows build and release
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build and self-test
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: vrc-network-monitor-win-x64
          path: publish/
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vrc-network-monitor-win-x64
          path: package/VRChat Network Monitor
      - name: Test release gating
        run: python3 .github/scripts/test-release.py
      - name: Package Windows application
        run: cd package && zip -r ../vrc-network-monitor-win-x64.zip 'VRChat Network Monitor'
      - name: Check latest commit and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh
